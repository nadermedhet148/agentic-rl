<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agentic-rl</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ec;
    --muted: #8b90a0;
    --accent: #5b8cff;
    --ok: #3ecf8e;
    --bad: #ef5b5b;
    --warn: #e0a84a;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --border: #dde1e8;
      --text: #1a1c22;
      --muted: #6b7080;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; }
  header .mode { color: var(--muted); font-size: 12px; }
  main {
    display: grid;
    grid-template-columns: minmax(320px, 1.3fr) 1fr;
    gap: 16px;
    padding: 16px;
    max-width: 1200px;
    margin: 0 auto;
  }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }
  .panel h2 { font-size: 13px; margin: 0; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  #chat-log { display: flex; flex-direction: column; gap: 10px; max-height: 480px; overflow-y: auto; }
  .msg { border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  .msg.user { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .msg .request { font-weight: 600; margin-bottom: 6px; word-break: break-word; }
  .msg .meta { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .status { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .status.executed { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
  .status.pending_confirmation { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .status.cancelled { background: color-mix(in srgb, var(--bad) 20%, transparent); color: var(--bad); }
  .status.error { background: color-mix(in srgb, var(--bad) 20%, transparent); color: var(--bad); }
  .status.running { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .step { border-top: 1px dashed var(--border); padding-top: 8px; margin-top: 8px; }
  .step:first-child { border-top: none; margin-top: 0; padding-top: 0; }
  .step-header { font-size: 12px; color: var(--muted); margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
  .step-header b { color: var(--text); }
  .step-icon { display: inline-block; width: 14px; text-align: center; }
  .step-icon.ok { color: var(--ok); }
  .step-icon.bad { color: var(--bad); }
  .step-icon.pending { color: var(--warn); }
  .path { color: var(--muted); font-size: 12px; }
  .thinking {
    border-left: 2px solid var(--border); padding-left: 8px; font-style: italic;
    color: var(--muted); font-size: 12px; margin: 4px 0 6px;
  }
  details.candidates { margin: 4px 0; font-size: 12px; }
  details.candidates summary { cursor: pointer; color: var(--muted); }
  .candidate { display: flex; gap: 8px; align-items: center; padding: 4px 0; flex-wrap: wrap; opacity: 0.55; }
  .candidate .confidence { color: var(--muted); font-size: 11px; }
  .confidence-bar { display: inline-block; width: 36px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; vertical-align: middle; }
  .confidence-fill { display: block; height: 100%; background: var(--accent); }
  .candidate.chosen { font-weight: 600; opacity: 1; border-left: 2px solid var(--accent); padding-left: 6px; }
  .candidate-badge {
    background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent);
    border-radius: 999px; padding: 0 6px; font-size: 10px; font-weight: 600;
  }
  .session-control { display: flex; align-items: center; gap: 8px; }
  .session-status { color: var(--muted); font-size: 12px; }
  .session-badge {
    background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent);
    border-radius: 999px; padding: 0 6px; font-size: 10px; font-weight: 600; white-space: nowrap;
  }
  .step-planning { color: var(--accent); }
  .step-planning .step-header { color: var(--accent); }
  .dots span { animation: blink 1.4s infinite; opacity: 0; }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
  .answer {
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius: 8px; padding: 10px; margin-top: 8px; white-space: pre-wrap; word-break: break-word;
  }
  .answer a { color: var(--accent); font-weight: 600; text-decoration: underline; }
  .max-steps-note { color: var(--muted); font-style: italic; font-size: 12px; margin-top: 8px; }
  .feedback { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  button.secondary.selected { background: var(--accent); color: white; border-color: var(--accent); }
  .feedback-thanks { color: var(--ok); font-size: 12px; }
  .correction-form { display: flex; gap: 6px; margin-top: 4px; width: 100%; }
  .correction-form input { flex: 1; }
  pre.params { background: var(--bg); border-radius: 6px; padding: 8px; overflow-x: auto; font-size: 12px; margin: 6px 0; }
  .outcome { border-radius: 6px; padding: 8px; margin: 6px 0; font-size: 12px; }
  .outcome.ok { background: color-mix(in srgb, var(--ok) 10%, transparent); border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent); }
  .outcome.bad { background: color-mix(in srgb, var(--bad) 10%, transparent); border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); }
  .outcome pre { margin: 4px 0 0; background: transparent; padding: 0; white-space: pre-wrap; word-break: break-word; }
  .result-list { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 0; padding: 0; list-style: none; }
  .result-list li a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .result-list li a:hover { text-decoration: underline; }
  .result-list li .snippet { color: var(--muted); }
  .actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  button {
    background: var(--accent); color: white; border: none; border-radius: 6px;
    padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button.danger { background: var(--bad); }
  button:disabled { opacity: 0.5; cursor: default; }
  input[type=text] {
    flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font-size: 13px;
  }
  #chat-form { display: flex; gap: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .empty { color: var(--muted); font-style: italic; padding: 6px 0; }
  .refresh { align-self: flex-end; }
  .stat { display: flex; gap: 16px; }
  .stat div b { font-size: 18px; display: block; }
  .stat div span { color: var(--muted); font-size: 11px; }
  .rule-list { display: flex; flex-direction: column; gap: 6px; }
  .rule-item {
    display: flex; align-items: flex-start; gap: 8px;
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
  }
  .rule-item .rule-text { flex: 1; word-break: break-word; }
  .rule-item .badge {
    background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent);
    border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  #rule-form { display: flex; gap: 8px; }
  select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 13px; max-width: 40%;
  }
  .agent-badge {
    background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok);
    border-radius: 999px; padding: 0 6px; font-size: 10px; font-weight: 600; white-space: nowrap;
  }
  .rule-item .badge.private { background: color-mix(in srgb, var(--muted) 18%, transparent); color: var(--muted); }
  .rule-item .badge.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .delegation-note { color: var(--muted); font-size: 12px; margin: 4px 0; }
  .trust-cell { text-align: center; font-variant-numeric: tabular-nums; border-radius: 4px; }
  .caps { color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>agentic-rl</h1>
  <span class="mode" id="mode-label">loading…</span>
</header>

<main>
  <section class="panel">
    <h2>Chat</h2>
    <div id="session-control" class="session-control">
      <button id="session-toggle-btn" class="secondary" type="button">Start session</button>
      <span id="session-status" class="session-status"></span>
    </div>
    <div id="chat-log"></div>
    <form id="chat-form">
      <select id="agent-select" title="Which agent handles this request" hidden>
        <option value="">Auto (router)</option>
      </select>
      <input type="text" id="chat-input" placeholder="e.g. fetch https://httpbin.org/json" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </section>

  <div style="display:flex; flex-direction:column; gap:16px; min-width:0;">
    <section class="panel">
      <h2>Reward</h2>
      <div class="stat">
        <div><b id="stat-mean">–</b><span>mean (last N)</span></div>
        <div><b id="stat-n">–</b><span>episodes counted</span></div>
      </div>
      <canvas id="reward-chart" height="120"></canvas>
    </section>

    <section class="panel" id="team-panel" hidden>
      <h2>Team</h2>
      <table id="agents-table">
        <thead><tr><th>Agent</th><th>Capabilities</th><th>Episodes</th><th>Mean reward</th></tr></thead>
        <tbody></tbody>
      </table>
      <h2>Trust (row trusts column)</h2>
      <table id="trust-table"><thead></thead><tbody></tbody></table>
    </section>

    <section class="panel">
      <h2>Rules</h2>
      <div id="rules-list" class="rule-list"></div>
      <form id="rule-form">
        <input type="text" id="rule-input" placeholder="Add a standing rule, e.g. always use UTC" autocomplete="off" />
        <button type="submit">Add</button>
      </form>
    </section>

    <section class="panel">
      <h2>Scheduled tasks</h2>
      <table id="tasks-table">
        <thead><tr><th>Instruction</th><th>Next run</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <button class="secondary refresh" onclick="loadTasks()">Refresh</button>
    </section>

    <section class="panel">
      <h2>Episodes</h2>
      <table id="episodes-table">
        <thead><tr><th>Request</th><th class="team-only" hidden>Agent</th><th>Status</th><th>Steps</th><th>Reward</th></tr></thead>
        <tbody></tbody>
      </table>
      <button class="secondary refresh" onclick="refreshAll()">Refresh</button>
    </section>
  </div>
</main>

<script>
const chatLog = document.getElementById("chat-log");
const chatForm = document.getElementById("chat-form");
const chatInput = document.getElementById("chat-input");
const sessionToggleBtn = document.getElementById("session-toggle-btn");
const sessionStatus = document.getElementById("session-status");

let chart = null;
let agents = [];  // from GET /agents; more than one = team mode (docs/MULTI-AGENT-PLAN.md)
const agentSelect = document.getElementById("agent-select");
function isTeam() { return agents.length > 1; }
let currentSessionId = null;
let currentSessionTurns = 0;

function renderSessionControl() {
  if (currentSessionId) {
    sessionToggleBtn.textContent = "End session";
    sessionStatus.textContent = `Session active · turn ${currentSessionTurns}`;
  } else {
    sessionToggleBtn.textContent = "Start session";
    sessionStatus.textContent = "";
  }
}

sessionToggleBtn.addEventListener("click", async () => {
  sessionToggleBtn.disabled = true;
  try {
    if (currentSessionId) {
      await api(`/sessions/${currentSessionId}/end`, { method: "POST" });
      currentSessionId = null;
      currentSessionTurns = 0;
    } else {
      const session = await api("/sessions", { method: "POST" });
      currentSessionId = session.id;
      currentSessionTurns = 0;
    }
  } finally {
    sessionToggleBtn.disabled = false;
  }
  renderSessionControl();
});

renderSessionControl();

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) {
    const body = await res.text();
    throw new Error(`${res.status}: ${body}`);
  }
  return res.status === 204 ? null : res.json();
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

// Turns markdown-style [text](url) links in an LLM answer into real, clickable
// <a> tags — the planner routinely writes these (e.g. pointing at a
// generate_report output) but nothing rendered them, so they showed up as
// literal text with no way to click through. Escapes first, then links only
// http(s):// or same-site "/" paths (never javascript:/data:/etc — the answer
// text isn't fully trusted, it can echo back web_search/http_call content).
function linkifyAnswer(text) {
  const escaped = escapeHtml(text);
  return escaped.replace(/\[([^\[\]]+)\]\((https?:\/\/[^\s()]+|\/[^\s()]+)\)/g, (_match, label, url) => (
    `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`
  ));
}

function renderOutcome(outcome) {
  if (!outcome) return "";
  const cls = outcome.ok ? "ok" : "bad";
  if (!outcome.ok) {
    return `<div class="outcome ${cls}"><b>error:</b> ${escapeHtml(outcome.error || "unknown error")}</div>`;
  }
  const payload = outcome.payload;
  if (payload && Array.isArray(payload.results)) {
    if (payload.results.length === 0) {
      return `<div class="outcome ${cls}"><b>result:</b> no results</div>`;
    }
    const items = payload.results.map((r) => `
      <li>
        <a href="${escapeHtml(r.url || "#")}" target="_blank" rel="noopener noreferrer">${escapeHtml(r.title || r.url || "(untitled)")}</a>
        ${r.snippet ? `<div class="snippet">${escapeHtml(r.snippet)}</div>` : ""}
      </li>`).join("");
    return `<div class="outcome ${cls}"><b>result:</b><ul class="result-list">${items}</ul></div>`;
  }
  return `<div class="outcome ${cls}"><b>result:</b><pre>${escapeHtml(JSON.stringify(payload, null, 2))}</pre></div>`;
}

const CAPABILITY_ICON = {
  web_search: "🌐",
  http_call: "🔗",
  schedule_task: "⏰",
  answer: "💬",
  delegate: "🤝",
};

function capabilityIcon(capability) {
  return CAPABILITY_ICON[capability] || "🛠️";
}

function stepStatusIcon(step) {
  if (!step.outcome) return `<span class="step-icon pending" title="pending confirmation">⏳</span>`;
  return step.outcome.ok
    ? `<span class="step-icon ok" title="succeeded">✓</span>`
    : `<span class="step-icon bad" title="failed">✗</span>`;
}

function renderCandidate(c, isChosen, explored) {
  const badge = isChosen ? (explored ? "explored" : "chosen") : "";
  const pct = Math.round((c.confidence ?? 0) * 100);
  return `
    <div class="candidate ${isChosen ? "chosen" : ""}">
      <span>${capabilityIcon(c.capability)} ${escapeHtml(c.capability || "(none)")}</span>
      <span class="confidence-bar"><span class="confidence-fill" style="width:${pct}%"></span></span>
      <span class="confidence">${pct}%</span>
      ${badge ? `<span class="candidate-badge">${badge}</span>` : ""}
    </div>`;
}

function renderStep(step, isLatest) {
  const candidate = step.action.candidate;
  const chosenIdx = step.action.index;
  const candidatesHtml = step.candidates
    .map((c, i) => renderCandidate(c, i === chosenIdx, step.action.explored))
    .join("");
  const isAnswer = candidate.capability === "answer";

  return `
    <div class="step">
      <div class="step-header">
        ${stepStatusIcon(step)}
        step ${step.index + 1} &middot; ${capabilityIcon(candidate.capability)} <b>${escapeHtml(candidate.capability || "(none)")}</b>
      </div>
      ${candidate.rationale ? `<div class="thinking">${escapeHtml(candidate.rationale)}</div>` : ""}
      <details class="candidates" ${isLatest ? "open" : ""}>
        <summary>${step.candidates.length} candidate${step.candidates.length === 1 ? "" : "s"} considered</summary>
        ${candidatesHtml}
      </details>
      ${isAnswer ? "" : `<pre class="params">${escapeHtml(JSON.stringify(candidate.params, null, 2))}</pre>`}
      ${renderDelegationNote(step)}
      ${isAnswer ? "" : renderOutcome(step.outcome)}
    </div>`;
}

function renderDelegationNote(step) {
  if (step.action.candidate.capability !== "delegate" || !step.child_episode_id) return "";
  const peer = escapeHtml(step.action.candidate.params.agent_id || "peer");
  const child = escapeHtml(step.child_episode_id.slice(0, 8));
  if (!step.outcome) {
    return `<div class="delegation-note">⏳ waiting on <b>${peer}</b> (episode ${child}), which paused for confirmation — confirming here confirms its step.</div>`;
  }
  return `<div class="delegation-note">handed to <b>${peer}</b> as episode ${child}</div>`;
}

function renderPlanningPlaceholder(nextIndex) {
  return `
    <div class="step step-planning">
      <div class="step-header">
        <span class="step-icon pending">⏳</span>
        step ${nextIndex + 1} &middot; planning<span class="dots"><span>.</span><span>.</span><span>.</span></span>
      </div>
    </div>`;
}

function applyStepEvent(local, step) {
  if (step.index < local.steps.length) {
    local.steps[step.index] = step;
  } else {
    local.steps.push(step);
  }
}

function renderEpisodeCard(episode) {
  const div = document.createElement("div");
  div.className = "msg";
  const steps = episode.steps || [];
  const rewardText = episode.status === "running"
    ? "…"
    : episode.final_reward != null
      ? episode.final_reward.toFixed(2)
      : (episode.implicit_reward ?? 0).toFixed(2) + " (implicit)";

  const timeline = steps.map((s, i) => renderStep(s, i === steps.length - 1)).join("")
    + (episode.status === "running" ? renderPlanningPlaceholder(steps.length) : "");
  const path = steps.length
    ? `<span class="path">${steps.map((s) => capabilityIcon(s.action.candidate.capability)).join(" &rarr; ")}</span>`
    : "";
  const answerHtml = episode.answer
    ? `<div class="answer">${linkifyAnswer(episode.answer)}</div>`
    : episode.status === "executed"
      ? `<div class="max-steps-note">Stopped without a final answer.</div>`
      : "";
  const errorHtml = episode.status === "error"
    ? `<div class="outcome bad"><b>error:</b> ${escapeHtml(episode.error || "unknown error")}</div>`
    : "";

  const sessionBadge = episode.session_id ? `<span class="session-badge">🔗 session</span>` : "";
  const agentBadge = isTeam() && episode.agent_id
    ? `<span class="agent-badge" title="${episode.routed ? "picked by the router" : "picked by you"}">🤖 ${escapeHtml(episode.agent_id)}${episode.routed ? " · routed" : ""}</span>`
    : "";

  div.innerHTML = `
    <div class="meta">
      <span class="status ${episode.status}">${episode.status.replace("_", " ")}</span>
      &nbsp;${steps.length} step${steps.length === 1 ? "" : "s"}
      &nbsp;${path}
      &nbsp;reward: <b>${rewardText}</b>
      &nbsp;${sessionBadge}
      &nbsp;${agentBadge}
    </div>
    ${timeline}
    ${answerHtml}
    ${errorHtml}
    <div class="actions" data-episode="${episode.id || ""}"></div>
  `;

  const actions = div.querySelector(".actions");

  if (!episode.id) {
    // still streaming — no actions until the run finishes or pauses
  } else if (episode.status === "pending_confirmation") {
    const confirmBtn = button("Confirm", "", async () => {
      confirmBtn.disabled = true;
      confirmBtn.textContent = "Confirming…";
      episode.status = "running";
      let card = renderEpisodeCard(episode);
      div.replaceWith(card);
      try {
        await consumeSse(`/confirm/${episode.id}/stream`, null, (name, data) => {
          if (name === "step") applyStepEvent(episode, data);
          else if (name === "done") {
            Object.assign(episode, data);
            if (currentSessionId && data.session_id === currentSessionId) {
              currentSessionTurns += 1;
              renderSessionControl();
            }
          } else if (name === "error") {
            episode.status = "error";
            episode.error = data.detail;
          }
          const newCard = renderEpisodeCard(episode);
          card.replaceWith(newCard);
          card = newCard;
        });
      } catch (err) {
        episode.status = "error";
        episode.error = err.message;
        const newCard = renderEpisodeCard(episode);
        card.replaceWith(newCard);
      }
      refreshEpisodesAndMetrics();
    });
    actions.appendChild(confirmBtn);
  } else if (episode.status === "executed") {
    actions.appendChild(renderFeedbackControl(episode.id));
  }
  return div;
}

function renderFeedbackControl(episodeId) {
  const wrap = document.createElement("div");
  wrap.className = "feedback";
  let submitted = false;

  const upBtn = button("👍 Good", "secondary", () => submit(1));
  const downBtn = button("👎 Bad", "secondary", () => submit(-1));
  const correctBtn = button("✏️ Correct", "secondary", () => {
    correctionForm.style.display = correctionForm.style.display === "flex" ? "none" : "flex";
    if (correctionForm.style.display === "flex") correctionInput.focus();
  });
  wrap.append(upBtn, downBtn, correctBtn);

  const correctionForm = document.createElement("div");
  correctionForm.className = "correction-form";
  correctionForm.style.display = "none";
  const correctionInput = document.createElement("input");
  correctionInput.type = "text";
  correctionInput.placeholder = "What should the agent have done instead?";
  const submitCorrectionBtn = button("Submit", "", () => {
    const text = correctionInput.value.trim();
    if (text) submit(-1, text);
  });
  correctionInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") submitCorrectionBtn.click();
  });
  correctionForm.append(correctionInput, submitCorrectionBtn);
  wrap.appendChild(correctionForm);

  async function submit(score, correction) {
    if (submitted) return;
    submitted = true;
    upBtn.disabled = true;
    downBtn.disabled = true;
    correctBtn.disabled = true;
    submitCorrectionBtn.disabled = true;
    correctionForm.style.display = "none";
    (score === 1 ? upBtn : correction ? correctBtn : downBtn).classList.add("selected");
    await sendFeedback(episodeId, score, correction);
    const thanks = document.createElement("span");
    thanks.className = "feedback-thanks";
    thanks.textContent = "✓ thanks for the feedback";
    wrap.appendChild(thanks);
  }

  return wrap;
}

async function consumeSse(url, body, onEvent) {
  const res = await fetch(url, {
    method: "POST",
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    throw new Error(`${res.status}: ${await res.text()}`);
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let sep;
    while ((sep = buffer.indexOf("\n\n")) !== -1) {
      const chunk = buffer.slice(0, sep);
      buffer = buffer.slice(sep + 2);
      let event = null;
      let data = null;
      for (const line of chunk.split("\n")) {
        if (line.startsWith("event: ")) event = line.slice(7);
        else if (line.startsWith("data: ")) data = line.slice(6);
      }
      if (event && data != null) onEvent(event, JSON.parse(data));
    }
  }
}

function button(label, cls, onClick) {
  const b = document.createElement("button");
  b.textContent = label;
  if (cls) b.className = cls;
  b.onclick = onClick;
  return b;
}

async function sendFeedback(episodeId, score, correction) {
  await api("/feedback", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ episode_id: episodeId, score, correction: correction || null }),
  });
  refreshEpisodesAndMetrics();
}

chatForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = chatInput.value.trim();
  if (!message) return;

  const userMsg = document.createElement("div");
  userMsg.className = "msg user";
  userMsg.innerHTML = `<div class="request">${escapeHtml(message)}</div>`;
  chatLog.appendChild(userMsg);
  chatInput.value = "";

  const local = { id: null, status: "running", steps: [], answer: null, final_reward: null, implicit_reward: 0 };
  let card = renderEpisodeCard(local);
  chatLog.appendChild(card);
  chatLog.scrollTop = chatLog.scrollHeight;

  try {
    const agentId = isTeam() && agentSelect.value ? agentSelect.value : null;
    await consumeSse("/chat/stream", { message, session_id: currentSessionId, agent_id: agentId }, (name, data) => {
      if (name === "step") applyStepEvent(local, data);
      else if (name === "done") {
        Object.assign(local, data);
        if (currentSessionId && data.session_id === currentSessionId) {
          currentSessionTurns += 1;
          renderSessionControl();
        }
      } else if (name === "error") {
        local.status = "error";
        local.error = data.detail;
      }
      const newCard = renderEpisodeCard(local);
      card.replaceWith(newCard);
      card = newCard;
      chatLog.scrollTop = chatLog.scrollHeight;
    });
  } catch (err) {
    local.status = "error";
    local.error = err.message;
    const newCard = renderEpisodeCard(local);
    card.replaceWith(newCard);
  }
  chatLog.scrollTop = chatLog.scrollHeight;
  refreshEpisodesAndMetrics();
});

async function loadHealth() {
  const health = await api("/health");
  document.getElementById("mode-label").textContent = `mode: ${health.mode} · v${health.version}`;
}

async function loadMetrics() {
  const metrics = await api("/metrics?n=100");
  document.getElementById("stat-n").textContent = metrics.n;
  document.getElementById("stat-mean").textContent = metrics.mean_reward != null ? metrics.mean_reward.toFixed(3) : "–";

  const ctx = document.getElementById("reward-chart");
  const datasets = [{ label: "all", data: metrics.rewards, borderColor: "#5b8cff", tension: 0.25, pointRadius: 0 }];
  if (isTeam()) {
    // one line per agent, each over its own episode index
    const perAgent = await Promise.all(agents.map((a) => api(`/agents/${encodeURIComponent(a.id)}/metrics?n=100`)));
    perAgent.forEach((m, i) => datasets.push({
      label: m.agent_id, data: m.rewards, borderColor: AGENT_COLORS[i % AGENT_COLORS.length],
      tension: 0.25, pointRadius: 0, borderWidth: 1.5,
    }));
  }
  const length = Math.max(...datasets.map((d) => d.data.length));
  const labels = Array.from({ length }, (_, i) => i + 1);
  if (chart) {
    chart.data.labels = labels;
    chart.data.datasets = datasets;
    chart.options.plugins.legend.display = isTeam();
    chart.update();
  } else {
    chart = new Chart(ctx, {
      type: "line",
      data: { labels, datasets },
      options: {
        responsive: true,
        scales: { y: { suggestedMin: -1, suggestedMax: 1 } },
        plugins: { legend: { display: isTeam() } },
      },
    });
  }
}

const AGENT_COLORS = ["#3ecf8e", "#e0a84a", "#ef5b5b", "#b07cff", "#4cc9f0"];

async function loadAgents() {
  agents = await api("/agents");
  const team = isTeam();
  agentSelect.hidden = !team;
  document.getElementById("team-panel").hidden = !team;
  document.querySelectorAll(".team-only").forEach((el) => { el.hidden = !team; });
  if (!team) return;

  const selected = agentSelect.value;
  agentSelect.innerHTML = `<option value="">Auto (router)</option>` + agents
    .map((a) => `<option value="${escapeHtml(a.id)}">${escapeHtml(a.name || a.id)}${a.role ? " — " + escapeHtml(a.role) : ""}</option>`)
    .join("");
  agentSelect.value = selected;

  const tbody = document.querySelector("#agents-table tbody");
  tbody.innerHTML = agents.map((a) => `
    <tr>
      <td><b>${escapeHtml(a.id)}</b>${a.role ? `<div class="caps">${escapeHtml(a.role)}</div>` : ""}</td>
      <td class="caps">${a.available_capabilities.map((c) => `${capabilityIcon(c)} ${escapeHtml(c)}`).join("<br>")}</td>
      <td>${a.recent_episodes}</td>
      <td>${a.mean_reward != null ? a.mean_reward.toFixed(2) : "–"}</td>
    </tr>`).join("");
  await loadTrust();
}

async function loadTrust() {
  const rows = await api("/agents/trust");
  const ids = agents.map((a) => a.id);
  const cell = {};
  for (const r of rows) cell[`${r.agent_id}|${r.peer_id}`] = r;
  document.querySelector("#trust-table thead").innerHTML =
    `<tr><th></th>${ids.map((id) => `<th>${escapeHtml(id)}</th>`).join("")}</tr>`;
  document.querySelector("#trust-table tbody").innerHTML = ids.map((row) => `
    <tr><th>${escapeHtml(row)}</th>${ids.map((col) => {
      if (row === col) return `<td class="trust-cell">–</td>`;
      const r = cell[`${row}|${col}`];
      if (!r) return `<td class="trust-cell">?</td>`;
      if (!r.sharing) return `<td class="trust-cell" title="sharing off">off</td>`;
      const pct = Math.round(r.trust * 100);
      return `<td class="trust-cell" style="background: color-mix(in srgb, var(--ok) ${pct}%, color-mix(in srgb, var(--bad) 35%, transparent))"
        title="${r.observations} observations">${r.trust.toFixed(2)}</td>`;
    }).join("")}</tr>`).join("");
}

async function loadRules() {
  const rules = await api("/memories?limit=50");
  const list = document.getElementById("rules-list");
  list.innerHTML = "";
  if (rules.length === 0) {
    list.innerHTML = `<div class="empty">No standing rules yet</div>`;
    return;
  }
  for (const rule of rules) {
    const row = document.createElement("div");
    row.className = "rule-item";
    const scopeBadge = !isTeam() ? "" : rule.scope === "team"
      ? `<span class="badge" title="shared with every agent">team</span>`
      : `<span class="badge private" title="only ${escapeHtml(rule.owner_agent_id)} sees this">private · ${escapeHtml(rule.owner_agent_id)}</span>`;
    const safetyBadge = rule.loosens_safety
      ? `<span class="badge warn" title="skips a confirmation — never shared automatically">⚠ loosens safety</span>`
      : "";
    row.innerHTML = `
      <span class="rule-text">${escapeHtml(rule.text)}</span>
      ${scopeBadge}
      ${safetyBadge}
      <span class="badge">seen ×${rule.support_count}</span>
    `;
    if (isTeam()) {
      const promote = rule.scope === "private";
      row.appendChild(button(promote ? "Share" : "Unshare", "secondary", async () => {
        await api(`/memories/${rule.id}/${promote ? "promote" : "demote"}`, { method: "POST" });
        loadRules();
      }));
    }
    const removeBtn = button("✕", "secondary", async () => {
      await api(`/memories/${rule.id}`, { method: "DELETE" });
      loadRules();
    });
    row.appendChild(removeBtn);
    list.appendChild(row);
  }
}

const ruleForm = document.getElementById("rule-form");
const ruleInput = document.getElementById("rule-input");
ruleForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = ruleInput.value.trim();
  if (!text) return;
  ruleInput.value = "";
  await api("/memories", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text, capability: null }),
  });
  loadRules();
});

async function loadTasks() {
  const tasks = await api("/tasks");
  const tbody = document.querySelector("#tasks-table tbody");
  tbody.innerHTML = "";
  if (tasks.length === 0) {
    tbody.innerHTML = `<tr><td colspan="3" class="empty">No scheduled tasks</td></tr>`;
    return;
  }
  for (const task of tasks) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${escapeHtml(task.instruction || "")}</td><td>${task.next_run_time || "–"}</td><td></td>`;
    const cancelBtn = button("Cancel", "danger", async () => {
      await api(`/tasks/${task.id}`, { method: "DELETE" });
      loadTasks();
    });
    tr.lastElementChild.appendChild(cancelBtn);
    tbody.appendChild(tr);
  }
}

async function loadEpisodes() {
  const episodes = await api("/episodes?limit=20");
  const tbody = document.querySelector("#episodes-table tbody");
  tbody.innerHTML = "";
  if (episodes.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty">No episodes yet</td></tr>`;
    return;
  }
  for (const ep of episodes) {
    const reward = ep.final_reward != null ? ep.final_reward.toFixed(2) : ep.implicit_reward.toFixed(2);
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td title="${escapeHtml(ep.state.request)}">${ep.parent_episode_id ? "↳ " : ""}${escapeHtml(ep.state.request.slice(0, 40))}</td>
      ${isTeam() ? `<td>${escapeHtml(ep.agent_id)}${ep.routed ? " <span class=\"caps\">(routed)</span>" : ""}</td>` : ""}
      <td><span class="status ${ep.status}">${ep.status.replace("_", " ")}</span></td>
      <td>${(ep.steps || []).length}</td>
      <td>${reward}</td>
    `;
    tbody.appendChild(tr);
  }
}

async function refreshEpisodesAndMetrics() {
  await loadAgents();
  await Promise.all([loadMetrics(), loadEpisodes(), loadTasks(), loadRules()]);
}

async function refreshAll() {
  await loadAgents();  // first: everything else renders differently in team mode
  await Promise.all([loadHealth(), loadMetrics(), loadTasks(), loadEpisodes(), loadRules()]);
}

refreshAll();
setInterval(refreshEpisodesAndMetrics, 15000);
</script>
