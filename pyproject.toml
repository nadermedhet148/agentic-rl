[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rl"
version = "0.1.0"
description = "An agent that executes predefined capabilities and learns from user feedback via RL."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    # claude | openai | google — one flag (AGENTIC_RL_PLANNER) picks the provider
    # at runtime; see llm/providers.py. All three extras are bundled by default
    # so the flag always works out of the box; drop the ones you don't need to
    # slim the install if that ever matters.
    "pydantic-ai-slim[anthropic,openai,google]>=2.30",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "ddgs>=9.0",
    "apscheduler>=3.10,<4",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]
observability = [
    "langfuse>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
